[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-rag-backend"
version = "0.1.0"
description = "Research toolkit for retrieval and grounded QA over video"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
]
research = [
    "anthropic>=0.40,<1",
    "av>=11,<19",
    "fastembed>=0.4,<1",
    "faster-whisper>=1.1,<2",
    "ImageHash>=4.3,<5",
    "openai>=1.55,<3",
    "Pillow>=10,<13",
    "scenedetect>=0.6,<1",
]
demo = [
    "streamlit>=1.40,<2",
]
server = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "arq>=0.26,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
    "yt-dlp>=2024.10.22",
    "aiosqlite>=0.20,<1",
    "qdrant-client>=1.12,<2",
    "pytesseract>=0.3.13,<1",
    "sentence-transformers>=3,<6",
    "transformers>=4.44,<5",
    "pre-commit>=3.8,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
