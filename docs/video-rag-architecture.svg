<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Video RAG system architecture</title>
  <desc id="figure-description">Three workflows: asynchronous API-backed video ingestion into PostgreSQL and Qdrant; question answering with text and visual retrieval, rank fusion, and timestamped citations; and a separate local research and evaluation path using SQLite.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#38536c" stroke-width="1.35"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#73869a" stroke-width="1.25"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b3d; }
      .title { font-size: 25px; font-weight: 600; letter-spacing: -0.25px; }
      .panel-title { font-size: 15px; font-weight: 700; letter-spacing: 0.65px; }
      .panel-note { font-size: 12px; fill: #617589; }
      .node-title { font-size: 14px; font-weight: 600; }
      .node-detail { font-size: 11.5px; fill: #52677b; }
      .storage-title { font-size: 12.5px; font-weight: 600; }
      .storage-detail { font-size: 11px; fill: #52677b; }
      .lane-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; fill: #60768b; }
      .panel { fill: #fff; stroke: #d7e0e8; stroke-width: 1.2; }
      .node { fill: #f7f9fb; stroke: #aebdca; stroke-width: 1.15; }
      .node-blue { fill: #edf3f8; stroke: #8ea7bb; stroke-width: 1.15; }
      .node-teal { fill: #edf6f5; stroke: #88aaa7; stroke-width: 1.15; }
      .node-output { fill: #f3f6f8; stroke: #91a1af; stroke-width: 1.15; }
      .storage { fill: #fbfcfd; stroke: #aebdca; stroke-width: 1.05; }
      .arrow { fill: none; stroke: #38536c; stroke-width: 1.45; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #38536c; stroke-width: 1.35; }
      .persist { fill: none; stroke: #73869a; stroke-width: 1.15; stroke-dasharray: 4 4; marker-end: url(#arrow-dashed); }
      .rule { stroke: #e4eaf0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1230" fill="#fff"/>
  <text class="title" x="56" y="53">Video RAG system architecture</text>
  <line class="rule" x1="56" y1="75" x2="1544" y2="75"/>

  <rect class="panel" x="48" y="96" width="1504" height="478" rx="8"/>
  <text class="panel-title" x="72" y="130">A  SERVICE INGESTION</text>
  <text class="panel-note" x="286" y="130">Asynchronous processing of uploaded or linked video into timestamped multimodal evidence</text>

  <path class="arrow" d="M225 246H257"/>
  <path class="arrow" d="M433 246H469"/>
  <path class="arrow" d="M631 246H667"/>
  <path class="arrow" d="M829 246H865"/>
  <path class="branch" d="M1040 246H1052V202H1072"/>
  <path class="arrow" d="M1052 246V356H1072"/>
  <path class="arrow" d="M1290 202H1324"/>
  <path class="arrow" d="M1290 356H1324"/>

  <rect class="node" x="72" y="207" width="153" height="78" rx="6"/>
  <text class="node-title" x="148.5" y="238" text-anchor="middle">Video source</text>
  <text class="node-detail" x="148.5" y="258" text-anchor="middle">upload or public URL</text>

  <rect class="node-blue" x="257" y="207" width="176" height="78" rx="6"/>
  <text class="node-title" x="345" y="238" text-anchor="middle">FastAPI</text>
  <text class="node-detail" x="345" y="258" text-anchor="middle">video / collection API</text>

  <rect class="node" x="469" y="207" width="162" height="78" rx="6"/>
  <text class="node-title" x="550" y="238" text-anchor="middle">Redis / ARQ</text>
  <text class="node-detail" x="550" y="258" text-anchor="middle">ingestion job queue</text>

  <rect class="node-blue" x="667" y="207" width="162" height="78" rx="6"/>
  <text class="node-title" x="748" y="238" text-anchor="middle">Worker</text>
  <text class="node-detail" x="748" y="258" text-anchor="middle">background ingestion</text>

  <rect class="node" x="865" y="207" width="175" height="78" rx="6"/>
  <text class="node-title" x="952.5" y="238" text-anchor="middle">Media preparation</text>
  <text class="node-detail" x="952.5" y="258" text-anchor="middle">download · FFmpeg</text>

  <text class="lane-label" x="1072" y="174">TEXT EVIDENCE</text>
  <rect class="node-teal" x="1072" y="181" width="218" height="87" rx="6"/>
  <text class="node-title" x="1181" y="211" text-anchor="middle">Timed transcript + OCR</text>
  <text class="node-detail" x="1181" y="231" text-anchor="middle">Faster-Whisper · Tesseract</text>
  <text class="node-detail" x="1181" y="249" text-anchor="middle">FastEmbed text vectors</text>

  <rect class="node-output" x="1324" y="181" width="202" height="87" rx="6"/>
  <text class="node-title" x="1425" y="216" text-anchor="middle">Qdrant</text>
  <text class="node-detail" x="1425" y="238" text-anchor="middle">text-vector collection</text>

  <text class="lane-label" x="1072" y="328">VISUAL EVIDENCE</text>
  <rect class="node-teal" x="1072" y="335" width="218" height="87" rx="6"/>
  <text class="node-title" x="1181" y="365" text-anchor="middle">Scene keyframes</text>
  <text class="node-detail" x="1181" y="385" text-anchor="middle">PySceneDetect · OCR</text>
  <text class="node-detail" x="1181" y="403" text-anchor="middle">SigLIP image vectors</text>

  <rect class="node-output" x="1324" y="335" width="202" height="87" rx="6"/>
  <text class="node-title" x="1425" y="370" text-anchor="middle">Qdrant</text>
  <text class="node-detail" x="1425" y="392" text-anchor="middle">image-vector collection</text>

  <path class="persist" d="M345 285V426H665V451"/>
  <path class="persist" d="M748 285V451"/>
  <path class="persist" d="M952 285V535H1308V519"/>

  <rect class="storage" x="436" y="451" width="500" height="68" rx="5"/>
  <text class="storage-title" x="456" y="477">PostgreSQL</text>
  <text class="storage-detail" x="456" y="498">video / job state · transcript segments · chapters · keyframe metadata · chat</text>

  <rect class="storage" x="1090" y="451" width="436" height="68" rx="5"/>
  <text class="storage-title" x="1110" y="477">Local media storage</text>
  <text class="storage-detail" x="1110" y="498">source / normalized video · extracted keyframe images</text>

  <text class="panel-note" x="72" y="546">Text and image vectors are indexed separately; media and timestamped records remain addressable for evidence retrieval.</text>

  <rect class="panel" x="48" y="594" width="1504" height="300" rx="8"/>
  <text class="panel-title" x="72" y="628">B  EVIDENCE-GROUNDED QUESTION ANSWERING</text>
  <text class="panel-note" x="437" y="628">API chat path</text>

  <path class="arrow" d="M220 754H246"/>
  <path class="arrow" d="M421 754H447"/>
  <path class="arrow" d="M668 754H694"/>
  <path class="arrow" d="M894 754H920"/>
  <path class="arrow" d="M1140 754H1166"/>
  <path class="arrow" d="M1391 754H1417"/>

  <rect class="node" x="72" y="710" width="148" height="88" rx="6"/>
  <text class="node-title" x="146" y="747" text-anchor="middle">Question</text>
  <text class="node-detail" x="146" y="769" text-anchor="middle">video or collection</text>

  <rect class="node-blue" x="246" y="710" width="175" height="88" rx="6"/>
  <text class="node-title" x="333.5" y="747" text-anchor="middle">FastAPI chat</text>
  <text class="node-detail" x="333.5" y="769" text-anchor="middle">scope · thread · top-k</text>

  <rect class="node-teal" x="447" y="710" width="221" height="88" rx="6"/>
  <text class="node-title" x="557.5" y="741" text-anchor="middle">Plan + encode query</text>
  <text class="node-detail" x="557.5" y="762" text-anchor="middle">Anthropic planner</text>
  <text class="node-detail" x="557.5" y="780" text-anchor="middle">FastEmbed · SigLIP</text>

  <rect class="node-teal" x="694" y="710" width="200" height="88" rx="6"/>
  <text class="node-title" x="794" y="747" text-anchor="middle">Dual retrieval</text>
  <text class="node-detail" x="794" y="769" text-anchor="middle">Qdrant text + image</text>

  <rect class="node" x="920" y="710" width="220" height="88" rx="6"/>
  <text class="node-title" x="1030" y="741" text-anchor="middle">Rank fusion + hydration</text>
  <text class="node-detail" x="1030" y="762" text-anchor="middle">reciprocal-rank fusion</text>
  <text class="node-detail" x="1030" y="780" text-anchor="middle">timestamps / content from PostgreSQL</text>

  <rect class="node-teal" x="1166" y="710" width="225" height="88" rx="6"/>
  <text class="node-title" x="1278.5" y="741" text-anchor="middle">Grounded answer</text>
  <text class="node-detail" x="1278.5" y="762" text-anchor="middle">Anthropic · retrieved evidence only</text>
  <text class="node-detail" x="1278.5" y="780" text-anchor="middle">citation validation</text>

  <rect class="node-output" x="1417" y="710" width="109" height="88" rx="6"/>
  <text class="node-title" x="1471.5" y="747" text-anchor="middle">Answer</text>
  <text class="node-detail" x="1471.5" y="769" text-anchor="middle">with citations</text>

  <path class="persist" d="M333 798V841H438"/>
  <path class="persist" d="M1471 798V841H1093"/>
  <rect class="storage" x="438" y="820" width="655" height="42" rx="5"/>
  <text class="storage-title" x="458" y="846">PostgreSQL — chat threads, messages, and verified citation records</text>
  <text class="panel-note" x="72" y="880">Returned citations include video titles and timestamp intervals.</text>

  <rect class="panel" x="48" y="914" width="1504" height="270" rx="8"/>
  <text class="panel-title" x="72" y="948">C  LOCAL RESEARCH AND EVALUATION</text>
  <text class="panel-note" x="393" y="948">Separate CLI / Streamlit path; no API service or Docker dependency</text>

  <path class="arrow" d="M238 1062H268"/>
  <path class="arrow" d="M489 1062H519"/>
  <path class="arrow" d="M778 1062H808"/>
  <path class="arrow" d="M1070 1062H1100"/>

  <rect class="node" x="72" y="1018" width="166" height="88" rx="6"/>
  <text class="node-title" x="155" y="1055" text-anchor="middle">Local videos</text>
  <text class="node-detail" x="155" y="1077" text-anchor="middle">research corpus</text>

  <rect class="node-blue" x="268" y="1018" width="221" height="88" rx="6"/>
  <text class="node-title" x="378.5" y="1050" text-anchor="middle">CLI indexer · Streamlit</text>
  <text class="node-detail" x="378.5" y="1072" text-anchor="middle">FFmpeg · Whisper · frame sampling</text>
  <text class="node-detail" x="378.5" y="1090" text-anchor="middle">FastEmbed · Jina CLIP</text>

  <rect class="node" x="519" y="1018" width="259" height="88" rx="6"/>
  <text class="node-title" x="648.5" y="1050" text-anchor="middle">SQLite research index</text>
  <text class="node-detail" x="648.5" y="1072" text-anchor="middle">transcripts · frames · embeddings</text>
  <text class="node-detail" x="648.5" y="1090" text-anchor="middle">local media paths</text>

  <rect class="node-teal" x="808" y="1018" width="262" height="88" rx="6"/>
  <text class="node-title" x="939" y="1050" text-anchor="middle">Retrieval experiments</text>
  <text class="node-detail" x="939" y="1072" text-anchor="middle">BM25 · dense · visual · hybrid</text>
  <text class="node-detail" x="939" y="1090" text-anchor="middle">RRF · temporal MMR</text>

  <rect class="node-output" x="1100" y="1018" width="426" height="88" rx="6"/>
  <text class="node-title" x="1313" y="1050" text-anchor="middle">Grounded QA + evaluation</text>
  <text class="node-detail" x="1313" y="1072" text-anchor="middle">Ollama (Qwen3-VL) default; OpenAI / Anthropic selectable</text>
  <text class="node-detail" x="1313" y="1090" text-anchor="middle">answer accuracy · latency · token usage</text>

  <text class="panel-note" x="72" y="1150">Research-mode indices, retrieval comparisons, and evaluation reports are independent of the service-backed Qdrant index.</text>
</svg>
